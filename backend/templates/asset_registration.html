<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 자산 등록서</title>
<style>
:root{--ink:#172238;--muted:#68758a;--line:#dce3ec;--paper:#f3f5f8;--blue:#164c96;--blue-bg:#eef4fc;--green:#24764a;--green-bg:#edf8f1;--red:#bb3939;--red-bg:#fff1f1;--amber:#9b6508;--amber-bg:#fff7e6}*{box-sizing:border-box;letter-spacing:0}body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;line-height:1.65}button{font:inherit}.sheet{width:min(1120px,calc(100% - 32px));margin:28px auto 56px;border:1px solid #cfd8e5;background:#fff;box-shadow:0 20px 55px rgba(27,43,67,.12)}.hero{padding:34px 40px 30px;border-bottom:2px solid var(--ink)}.hero-top,.hero-meta,.sec-head,.data-row{display:flex;align-items:center}.hero-top,.sec-head{justify-content:space-between;gap:18px}.hero-top{margin-bottom:20px}.kind{color:var(--blue);font-size:12px;font-weight:800}.status{display:inline-flex;align-items:center;gap:6px;border:1px solid;padding:5px 10px;font-size:11px;font-weight:800}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.status.submitted{border-color:#ecd194;background:var(--amber-bg);color:var(--amber)}.status.approved{border-color:#add9bf;background:var(--green-bg);color:var(--green)}.status.rejected{border-color:#edb8b8;background:var(--red-bg);color:var(--red)}.eyebrow{margin-bottom:7px;color:#8190a4;font-size:11px;font-weight:800}h1{margin:0;color:#111c30;font-size:31px;line-height:1.3}.summary{max-width:860px;margin:13px 0 20px;color:#536176;font-size:14px}.hero-meta{flex-wrap:wrap;gap:8px}.chip{border:1px solid #d6deea;background:#f7f9fc;padding:5px 9px;color:#536176;font-size:11.5px}.chip b{color:#253249}.section{padding:28px 40px;border-bottom:1px solid var(--line)}.sec-head{margin-bottom:17px}.sec-title{display:flex;align-items:baseline;gap:10px}.sec-num{color:var(--blue);font:800 11px ui-monospace,Consolas,monospace}h2{margin:0;color:#1d2a40;font-size:17px}.note{color:#8a96a7;font-size:11.5px}.grid2,.slides,.tech-grid,.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{border:1px solid #e9edf3;background:#fafbfd;padding:16px 17px}.field.full{grid-column:1/-1}.label{display:block;margin-bottom:7px;color:#718096;font-size:11px;font-weight:800}.value{margin:0;color:#35445b;font-size:13.5px;white-space:pre-wrap}.tags{display:flex;flex-wrap:wrap;gap:7px}.tag{border:1px solid #cad8eb;background:var(--blue-bg);color:#315a8d;padding:4px 8px;font-size:11px;font-weight:700}.empty{border:1px dashed #ccd6e3;padding:24px;color:#8a96a7;font-size:12.5px;text-align:center}.data-table{border:1px solid var(--line)}.data-row{min-height:54px;border-bottom:1px solid #e9edf3}.data-row:last-child{border-bottom:0}.data-role{flex:0 0 108px;align-self:stretch;display:grid;place-items:center;background:#edf2f7;color:#40516a;font-size:11px;font-weight:800}.data-file{min-width:0;flex:1;padding:10px 14px}.data-file b{display:block;overflow:hidden;font-size:12.5px;text-overflow:ellipsis;white-space:nowrap}.data-file span{color:#8793a3;font-size:10.5px}.slide{border:1px solid var(--line);background:#fafbfd;overflow:hidden}.slide-image{aspect-ratio:16/9;display:grid;place-items:center;background:#e9edf3;overflow:hidden}.slide-image img{width:100%;height:100%;object-fit:contain}.slide-info{padding:13px 14px 15px}.slide-info b{font-size:13px}.slide-info p{margin:5px 0 0;color:#707d90;font-size:11.5px}.tech,.metric{border:1px solid var(--line);background:#fafbfd;padding:14px}.tech b,.metric b{font-size:12.5px}.tech p{margin:5px 0 0;color:var(--muted);font-size:11.5px}.tech a{float:right;color:var(--blue);font-size:10.5px;text-decoration:none}.metric-values{display:flex;align-items:center;gap:9px;margin-top:10px}.metric-values span{border:1px solid #e9edf3;background:#fff;padding:5px 8px;color:#5f6d80;font-size:11px}.metric-values i{color:var(--blue);font-style:normal}.metric-values em{margin-left:auto;color:var(--green);font-size:11px;font-style:normal;font-weight:800}.repo-source{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:10px;margin-bottom:12px}.repo-source>div{min-width:0;border:1px solid var(--line);background:#f7f9fc;padding:11px 13px}.repo-source span{display:block;margin-bottom:4px;color:#7b889a;font-size:10px;font-weight:800}.repo-source a,.repo-source code{display:block;overflow:hidden;color:#2e405b;font:11.5px ui-monospace,Consolas,monospace;text-decoration:none;text-overflow:ellipsis;white-space:nowrap}.repo-source a:hover{color:var(--blue);text-decoration:underline}.tree{min-height:0;overflow:auto;padding:7px 0 12px}.tree-frame{max-height:350px;border:1px solid var(--line);background:#f7f9fb}.tree-row{min-height:29px;width:100%;border:0;background:transparent;padding:5px 11px;display:flex;align-items:center;gap:7px;color:#35445b;font-size:11.5px;text-align:left}.tree-row strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}button.tree-row{cursor:pointer}button.tree-row:hover,button.tree-row.active{background:#e6eef9;color:var(--blue)}.explorer{height:430px;border:1px solid #cfd9e6;display:grid;grid-template-columns:minmax(230px,31%) minmax(0,1fr);overflow:hidden}.tree-pane{min-width:0;min-height:0;border-right:1px solid #d8e0eb;background:#f5f7fa;display:grid;grid-template-rows:39px minmax(0,1fr)}.pane-head,.viewer-path{border-bottom:1px solid #dde4ee;padding:0 12px;display:flex;align-items:center;color:#42536b;font-size:11px;font-weight:800}.pane-head{justify-content:space-between}.pane-head span:last-child{color:#8b97a8;font-size:10px}.viewer{min-width:0;min-height:0;display:grid;grid-template-rows:39px minmax(0,1fr)}.viewer-path{background:#f8fafc;font-family:ui-monospace,Consolas,monospace}.viewer pre{min-height:0;margin:0;overflow:auto;padding:16px 18px;color:#25344b;font:11.5px/1.6 ui-monospace,Consolas,monospace;white-space:pre;tab-size:2}details{border:1px solid var(--line);background:#fafbfd}summary{cursor:pointer;padding:12px 14px;color:#40516a;font-size:12px;font-weight:800}details pre{max-height:380px;margin:0;border-top:1px solid var(--line);overflow:auto;padding:16px;color:#425067;font:10.5px ui-monospace,Consolas,monospace;white-space:pre-wrap}.footer{padding:18px 40px 24px;display:flex;justify-content:space-between;color:#8a96a7;font-size:10.5px}@media(max-width:760px){.sheet{width:100%;margin:0;border:0;box-shadow:none}.hero,.section{padding-left:20px;padding-right:20px}h1{font-size:25px}.grid2,.slides,.tech-grid,.metric-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.explorer{height:620px;grid-template-columns:1fr;grid-template-rows:230px minmax(0,1fr)}.tree-pane{border-right:0;border-bottom:1px solid #d8e0eb}.repo-source{grid-template-columns:1fr}.footer{padding-left:20px;padding-right:20px}}
</style></head>
<body><div id="document"></div><script>
const DATA=__ASSET_DATA_JSON__,asset=DATA.asset||{},payload=(DATA.meta&&DATA.meta.payload)||{};
const value=(a,b)=>a??b??"-",esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),list=(a,b)=>Array.isArray(a)?a:(Array.isArray(b)?b:[]),date=v=>v?String(v).slice(0,10):"-";
const bytes=v=>{const n=Number(v||0);return !n?"크기 정보 없음":n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(1)+" MB"};
const statusMap={submitted:{label:"제출 완료",cls:"submitted"},approved:{label:"승인",cls:"approved"},rejected:{label:"반려",cls:"rejected"}},status=statusMap[asset.approval_status]||statusMap.submitted,roles={train:"학습 데이터",validation:"검증 데이터",sample:"샘플 데이터"};
const tags=a=>a.map(v=>'<span class="tag">'+esc(v)+'</span>').join("");
function tech(items,key){return items.length?items.map(v=>'<div class="tech"><b>'+esc(v[key]||v.name||"-")+'</b>'+(v.reference_url?'<a href="'+esc(v.reference_url)+'" target="_blank">Reference</a>':"")+'<p>'+esc(v.description||"-")+'</p></div>').join(""):'<div class="empty">등록된 정보가 없습니다.</div>'}
function metrics(items,perf){return items.length?items.map(v=>perf?'<div class="metric"><b>'+esc(v.metric_name||"-")+'</b><div class="metric-values"><span>'+esc(v.value||"-")+'</span></div><p class="value" style="margin-top:9px">'+esc(v.description||"-")+'</p></div>':'<div class="metric"><b>'+esc(v.metric_name||"-")+'</b><div class="metric-values"><span>'+esc(v.before_value||"-")+'</span><i>→</i><span>'+esc(v.after_value||"-")+'</span><em>'+esc(v.improvement_rate||"")+'</em></div></div>').join(""):'<div class="empty">등록된 지표가 없습니다.</div>'}
function repo(nodes,depth=0){if(!Array.isArray(nodes)||!nodes.length)return depth?"":'<div class="empty">저장소 파일 트리가 없습니다.</div>';return nodes.map(n=>'<div class="tree-row" style="padding-left:'+(11+depth*15)+'px"><span>'+(n.type==="directory"?"▾ 📁":"📄")+'</span><strong>'+esc(n.name)+'</strong></div>'+(n.type==="directory"?repo(n.children||[],depth+1):"")).join("")}
function skillTree(files){const root=[];files.forEach((f,fi)=>{let children=root;String(f.file_path||"").split("/").filter(Boolean).forEach((part,i,a)=>{const type=i===a.length-1?"file":"directory";let node=children.find(n=>n.name===part&&n.type===type);if(!node){node=type==="file"?{name:part,type,fileIndex:fi}:{name:part,type,children:[]};children.push(node)}if(type==="directory")children=node.children})});return root}
function skillNodes(nodes,depth=0){return nodes.map(n=>n.type==="directory"?'<div class="tree-row" style="padding-left:'+(11+depth*15)+'px"><span>▾ 📁</span><strong>'+esc(n.name)+'</strong></div>'+skillNodes(n.children,depth+1):'<button class="tree-row skill-file" data-index="'+n.fileIndex+'" style="padding-left:'+(11+depth*15)+'px"><span>📄</span><strong>'+esc(n.name)+'</strong></button>').join("")}
const repoUrl=value(asset.repo_url,payload.repo_url),repoBranch=value(asset.repo_branch,payload.repo_branch),repoUrlValue=/^https?:\/\//i.test(repoUrl)?'<a href="'+esc(repoUrl)+'" target="_blank" rel="noopener noreferrer">'+esc(repoUrl)+'</a>':'<code>'+esc(repoUrl)+'</code>',repoSourceHtml='<div class="repo-source"><div><span>Git URL</span>'+repoUrlValue+'</div><div><span>Branch</span><code>'+esc(repoBranch)+'</code></div></div>';
const task=list(asset.task_types,payload.task_types),impl=list(asset.implementation_types,payload.implementation_types),allTags=list(asset.tags,payload.tags),models=list(asset.models,payload.models),stacks=list(asset.tech_stacks,payload.tech_stacks),before=list(asset.before_after_metrics,payload.before_after_metrics),perf=list(asset.performance_metrics,payload.performance_metrics);
const dataHtml=DATA.data_files.length?'<div class="data-table">'+DATA.data_files.map(f=>'<div class="data-row"><div class="data-role">'+esc(roles[f.data_role]||f.data_role)+'</div><div class="data-file"><b>'+esc(f.file_name)+'</b><span>'+bytes(f.file_size)+' · '+esc(f.content_type||"파일")+'</span></div></div>').join("")+'</div>':'<div class="empty">첨부된 데이터 파일이 없습니다.</div>';
const slidesHtml=DATA.slides.length?DATA.slides.map(s=>'<article class="slide"><div class="slide-image">'+(s.data_uri?'<img src="'+esc(s.data_uri)+'" alt="'+esc(s.caption||s.file_name)+'">':'<span class="note">이미지를 불러올 수 없습니다.</span>')+'</div><div class="slide-info"><b>'+esc(s.caption||s.file_name)+'</b><p>'+esc(s.description||"설명이 없습니다.")+'</p></div></article>').join(""):'<div class="empty">등록된 자산 활용 화면이 없습니다.</div>';
const section=(num,title,body,note="")=>'<section class="section"><div class="sec-head"><div class="sec-title"><span class="sec-num">SEC.'+num+'</span><h2>'+title+'</h2></div><span class="note">'+note+'</span></div>'+body+'</section>';
let html='<main class="sheet"><header class="hero"><div class="hero-top"><div><div class="kind">AI STUDIO · 자산 등록서</div></div><span class="status '+status.cls+'">'+status.label+'</span></div><div class="eyebrow">자산명</div><h1>'+esc(value(asset.asset_name,payload.asset_name))+'</h1><p class="summary">'+esc(value(asset.description,payload.description))+'</p><div class="hero-meta"><span class="chip"><b>업무 영역</b> · '+esc(value(asset.business_area,payload.business_area))+'</span><span class="chip"><b>성숙도</b> · '+esc(value(asset.maturity_level,payload.maturity_level))+'</span><span class="chip"><b>담당자</b> · '+esc(value(asset.owner_name,payload.owner_name))+' / '+esc(value(asset.owner_org,payload.owner_org))+' / '+esc(value(asset.owner_job_title,payload.owner_job_title))+'</span><span class="chip"><b>제출일</b> · '+date(asset.submitted_at||asset.created_at)+'</span></div></header>';
html+=section("01","자산 개요",'<div class="grid2"><div class="field"><span class="label">Task 유형</span><div class="tags">'+tags(task)+'</div></div><div class="field"><span class="label">구현 방식</span><div class="tags">'+tags(impl)+'</div></div><div class="field full"><span class="label">태그</span><div class="tags">'+tags(allTags)+'</div></div></div>');
html+=section("02","과제 정의와 업무 변화",'<div class="grid2"><div class="field full"><span class="label">문제 정의</span><p class="value">'+esc(value(asset.problem_definition,payload.problem_definition))+'</p></div><div class="field"><span class="label">As-Is Workflow</span><p class="value">'+esc(value(asset.as_is_workflow,payload.as_is_workflow))+'</p></div><div class="field"><span class="label">To-Be Workflow</span><p class="value">'+esc(value(asset.to_be_workflow,payload.to_be_workflow))+'</p></div><div class="field full"><span class="label">AI 개선 효과</span><p class="value">'+esc(value(asset.ai_effect,payload.ai_effect))+'</p></div></div>');
html+=section("03","데이터",'<div class="field" style="margin-bottom:12px"><span class="label">데이터 설명</span><p class="value">'+esc(value(asset.data_description,payload.data_description))+'</p></div>'+dataHtml,esc(value(asset.data_type,payload.data_type)));
html+=section("04","자산 활용 화면",'<div class="slides">'+slidesHtml+'</div>',DATA.slides.length+"개 이미지");
html+=section("05","기술 구성",'<div class="grid2"><div><span class="label">모델 / 알고리즘</span><div class="tech-grid" style="grid-template-columns:1fr">'+tech(models,"model_name")+'</div></div><div><span class="label">기술 스택</span><div class="tech-grid" style="grid-template-columns:1fr">'+tech(stacks,"stack_name")+'</div></div></div>');
html+=section("06","성과 및 성능 지표",'<span class="label">Before / After 비교</span><div class="metric-grid">'+metrics(before,false)+'</div><span class="label" style="margin-top:18px">성능 지표</span><div class="metric-grid">'+metrics(perf,true)+'</div>');
html+=section("07","저장소 파일 구조",repoSourceHtml+'<div class="tree tree-frame">'+repo(DATA.repo_tree));
html+=section("08","확산 패키지",'<div id="skill-explorer"></div>',DATA.skill_files.length+"개 파일");
html+='<footer class="footer"><span>AI STUDIO · ASSET REGISTRATION</span><span>'+date(asset.updated_at)+'</span></footer></main>';document.getElementById("document").innerHTML=html;
const explorer=document.getElementById("skill-explorer");if(DATA.skill_files.length){explorer.innerHTML='<div class="explorer"><div class="tree-pane"><div class="pane-head"><span>생성된 파일</span><span>'+DATA.skill_files.length+' files</span></div><div class="tree">'+skillNodes(skillTree(DATA.skill_files))+'</div></div><div class="viewer"><div class="viewer-path" id="skill-path"></div><pre id="skill-content"></pre></div></div>';const select=i=>{const f=DATA.skill_files[i];document.getElementById("skill-path").textContent=f.file_path;document.getElementById("skill-content").textContent=f.content||"";document.querySelectorAll(".skill-file").forEach(b=>b.classList.toggle("active",Number(b.dataset.index)===i))};document.querySelectorAll(".skill-file").forEach(b=>b.onclick=()=>select(Number(b.dataset.index)));select(0)}else explorer.innerHTML='<div class="empty">생성된 Skill 파일이 없습니다.</div>';
document.title=value(asset.asset_name,payload.asset_name)+" · AI 자산 등록서";
</script></body></html>
